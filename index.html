<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>レトロテレビ・ジャンプゲーム</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* テレビ全体を収めるコンテナ */
        .tv-container {
            position: relative;
            width: 95vw;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            cursor: pointer;
        }

        /* テレビの枠画像 */
        .tv-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            z-index: 1;
        }

        /* テレビの緑画面に精密調整したハメ込み領域 */
        .tv-screen {
            position: absolute;
            top: 13.5%;
            left: 15.8%;
            width: 68.4%;
            height: 54.5%;
            background: #112211;
            overflow: hidden;
            border-radius: 12px / 8px;
            z-index: 2;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* スキャンライン（走査線） */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 3;
        }

        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <div class="tv-container" id="tvContainer">
        <!-- 背景のテレビ枠 (TV.jpg) -->
        <img src="TV.jpg" alt="TV Frame" class="tv-bg" id="tvImg">

        <!-- ゲーム画面（緑の部分） -->
        <div class="tv-screen">
            <div class="scanlines"></div>
            <canvas id="gameCanvas" width="800" height="400"></canvas>
        </div>
    </div>

    <div class="instructions">
        画面全体をタップ または スペースキーでジャンプ（2段ジャンプ可）
    </div>
