<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>レトロテレビ・ジャンプゲーム</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* 全体枠コンテナ */
        .tv-container {
            position: relative;
            width: 100vw;
            height: 80vh;
            max-width: 900px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* テレビ画像 */
        .tv-bg {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        /* テレビの緑画面部分（JavaScriptでTV画像の位置に自動で合体させます） */
        .tv-screen {
            position: absolute;
            background: #112211;
            overflow: hidden;
            border-radius: 12px;
            z-index: 2;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* スキャンライン */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 3;
        }

        .instructions {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <div class="tv-container" id="tvContainer">
        <img src="TV.jpg" alt="TV Frame" class="tv-bg" id="tvImg">

        <div class="tv-screen" id="tvScreen">
            <div class="scanlines"></div>
            <canvas id="gameCanvas" width="800" height="400"></canvas>
        </div>
    </div>

    <div class="instructions">
        画面タップ または スペースキーでジャンプ（2段ジャンプ可）
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const tvImg = document.getElementById('tvImg');
        const tvScreen = document.getElementById('tvScreen');
        const tvContainer = document.getElementById('tvContainer');

        // --- テレビの緑画面部分にCanvasを自動でピッタリ合わせるリサイズ計算 ---
        function fitScreenToTV() {
            if (!tvImg.complete || tvImg.naturalWidth === 0) return;

            const containerRect = tvContainer.getBoundingClientRect();
            const imgRatio = tvImg.naturalWidth / tvImg.naturalHeight;
            const containerRatio = containerRect.width / containerRect.height;

            let renderWidth, renderHeight, offsetX, offsetY;

            if (containerRatio > imgRatio) {
                renderHeight = containerRect.height;
                renderWidth = renderHeight * imgRatio;
                offsetX = (containerRect.width - renderWidth) / 2;
                offsetY = 0;
            } else {
                renderWidth = containerRect.width;
                renderHeight = renderWidth / imgRatio;
                offsetX = 0;
                offsetY = (containerRect.height - renderHeight) / 2;
            }

            // TV.jpg 内の緑色の画面位置比率 (Top:13.5%, Left:15.8%, Width:68.4%, Height:54.5%)
            tvScreen.style.left = (offsetX + renderWidth * 0.158) + 'px';
            tvScreen.style.top = (offsetY + renderHeight * 0.135) + 'px';
            tvScreen.style.width = (renderWidth * 0.684) + 'px';
            tvScreen.style.height = (renderHeight * 0.545) + 'px';
        }

        window.addEventListener('resize', fitScreenToTV);
        tvImg.addEventListener('load', fitScreenToTV);
        tvImg.onerror = () => {
            tvImg.src = 'TV.JPG';
        };
        // 初期読み込み時にも実行
        setTimeout(fitScreenToTV, 100);

        // --- ゲーム処理 ---
        const player = {
            x: 100,
            y: 250,
            height: 50,
            width: 50,
            vy: 0,
            gravity: 0.75,
            jumpPower: -12.5,
            doubleJumpPower: -10.5,
            jumpCount: 0
        };

        const groundLevel = 250;
        let obstacles = [];
        let gameSpeed = 5;
        let score = 0;
        let isStarted = false;
        let isGameOver = false;
        let nextObstacleTimer = 0;

        const charImage = new Image();
        let imageLoaded = false;
        charImage.onload = () => {
            imageLoaded = true;
            player.width = player.height * (charImage.naturalWidth / charImage.naturalHeight);
        };
        charImage.src = 'TTK_2.PNG';

        const flowerImage = new Image();
        let flowerLoaded = false;
        let flowerAspectRatio = 1;
        flowerImage.onload = () => {
            flowerLoaded = true;
            flowerAspectRatio = flowerImage.naturalWidth / flowerImage.naturalHeight;
        };
        flowerImage.src = 'IMG_4627.PNG';

        const birdImage = new Image();
        let birdLoaded = false;
        let birdAspectRatio = 1.3;
        birdImage.onload = () => {
            birdLoaded = true;
            birdAspectRatio = birdImage.naturalWidth / birdImage.naturalHeight;
        };
        birdImage.src = 'IMG_4630.PNG';

        function triggerAction(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            if (!isStarted || isGameOver) {
                resetGame();
                return;
            }

            if (player.jumpCount < 2) {
                if (player.jumpCount === 0) {
                    player.vy = player.jumpPower;
                } else {
                    player.vy = player.doubleJumpPower;
                }
                player.jumpCount++;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                triggerAction();
            }
        });

        tvContainer.addEventListener('pointerdown', (e) => {
            triggerAction(e);
        });

            obstacles = [];
            score = 0;
            gameSpeed = 5;
            isGameOver =
