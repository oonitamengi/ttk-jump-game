<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOBU-YATU</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #050b07;
            color: #00ffcc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* レトロ液晶/CRTモニター風の画面外枠 */
        .crt-monitor {
            position: relative;
            width: 95vw;
            max-width: 800px;
            aspect-ratio: 2 / 1;
            background: #05140b;
            border-radius: 20px;
            box-shadow: 
                inset 0 0 40px rgba(0, 255, 170, 0.25),
                0 0 30px rgba(0, 255, 204, 0.3),
                0 0 0 12px #122118,
                0 0 0 16px #08100b;
            border: 3px solid #004d33;
            overflow: hidden;
            cursor: pointer;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            filter: drop-shadow(0 0 4px #00ffcc);
        }

        /* ブラウン管特有のスキャンライン（走査線）効果 */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.35) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .instructions {
            margin-top: 25px;
            font-size: 14px;
            color: #00b386;
            text-align: center;
            padding: 0 10px;
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.4);
        }
    </style>
</head>
<body>

    <div class="crt-monitor" id="crtMonitor">
        <div class="scanlines"></div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <div class="instructions">
        画面タップ または スペースキーでジャンプ（2段ジャンプ可）
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const crtMonitor = document.getElementById('crtMonitor');

        const player = {
            x: 100,
            y: 250,
            height: 50,
            width: 50,
            vy: 0,
            gravity: 0.75,
            jumpPower: -12.5,
            doubleJumpPower: -10.5,
            jumpCount: 0
        };

        const groundLevel = 250;

        let obstacles = [];
        let gameSpeed = 5;
        let score = 0;
        let isStarted = false;
        let isGameOver = false;
        let nextObstacleTimer = 0;

        // アセット画像の読み込み (TTK_2.PNG, IMG_4627.PNG, IMG_4630.PNG)
        const charImage = new Image();
        let imageLoaded = false;
        charImage.onload = () => { imageLoaded = true; };
        charImage.src = 'TTK_2.PNG';

        const flowerImage = new Image();
        let flowerLoaded = false;
        flowerImage.onload = () => { flowerLoaded = true; };
        flowerImage.src = 'IMG_4627.PNG';

        const birdImage = new Image();
        let birdLoaded = false;
        birdImage.onload = () => { birdLoaded = true; };
        birdImage.src = 'IMG_4630.PNG';

        function triggerAction(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            if (!isStarted || isGameOver) {
                resetGame();
                return;
            }

            if (player.jumpCount < 2) {
                if (player.jumpCount === 0) {
                    player.vy = player.jumpPower;
                } else {
                    player.vy = player.doubleJumpPower;
                }
                player.jumpCount++;
            }
        }

        // キーボード操作（スペースキー）
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                triggerAction();
            }
        });

        // モニターエリア全体のタップ/クリック操作
        crtMonitor.addEventListener('pointerdown', (e) => {
            triggerAction(e);
        });

        function resetGame() {
            obstacles = [];
            score = 0;
            gameSpeed = 5;
            isGameOver = false;
            isStarted = true;
            player.y = groundLevel;
            player.vy = 0;
            player.jumpCount = 0;
            nextObstacleTimer = 50;
        }
