<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ジャンプゲーム</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #222;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
        }
        canvas {
            background: #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button, label.file-btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover, label.file-btn:hover {
            background: #e64a19;
        }
        input[type="file"] {
            display: none;
        }
        .instructions {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div class="controls">
        <button id="jumpBtn">ジャンプ (Space / タップ)</button>
        <label class="file-btn">
            📁 主人公画像を選択
            <input type="file" id="imageLoader" accept="image/*">
        </label>
    </div>
    <div class="instructions">
        ※PCは [Space] キーまたはクリック、スマホは画面タップでジャンプします。
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 音声用のコンテキスト（Web Audio API）
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playJumpSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log(e);
            }
        }

        // プレイヤー設定
        const player = {
            x: 100,
            y: 250,
            width: 50,
            height: 50,
            vy: 0,
            gravity: 0.8,
            jumpPower: -13,
            isGrounded: false
        };

        // 障害物設定
        let obstacles = [];
        let gameSpeed = 5;
        let score = 0;
        let isGameOver = false;
        let frameCount = 0;

        // キャラクター画像
        let charImage = new Image();
        let imageLoaded = false;

        // 画像読み込み設定（TTK_2.PNG を優先し、失敗時は小文字やJPGをフォールバック）
        function loadCharacterImage(src) {
            charImage.onload = function() {
                imageLoaded = true;
                console.log("画像読み込み成功:", src);
            };
            charImage.onerror = function() {
                console.log("画像読み込み失敗:", src);
                if (src === 'TTK_2.PNG') {
                    loadCharacterImage('TTK_2.png'); // 小文字を試す
                } else if (src === 'TTK_2.png') {
                    loadCharacterImage('TTK_2.jpg'); // jpgを試す
                } else {
                    imageLoaded = false;
                }
            };
            charImage.src = src;
        }

        // 初期読み込み試行
        loadCharacterImage('TTK_2.PNG');

        // ファイルピッカーで画像が選択された時
        document.getElementById('imageLoader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    charImage.src = event.target.result;
                    imageLoaded = true;
                };
                reader.readAsDataURL(file);
            }
        });

        // 入力処理
        function jump() {
            initAudio();
            if (isGameOver) {
                resetGame();
                return;
            }
            if (player.isGrounded) {
                player.vy = player.jumpPower;
                player.isGrounded = false;
                playJumpSound();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });

        canvas.addEventListener('click', () => {
            jump();
        });

        document.getElementById('jumpBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            jump();
        });

        function resetGame() {
            obstacles = [];
            score = 0;
            gameSpeed = 5;
            isGameOver = false;
            player.y = 250;
            player.vy = 0;
        }

        // ゲームループ
        function update() {
            if (!isGameOver) {
                frameCount++;
                score++;

                // 物理演算
                player.vy += player.gravity;
                player.y += player.vy;

                // 地面判定
                const groundLevel = 300;
                if (player.y >= groundLevel) {
                    player.y = groundLevel;
                    player.vy = 0;
                    player.isGrounded = true;
                }

                // 障害物の生成
                if (frameCount % 100 === 0) {
                    obstacles.push({
                        x: canvas.width,
                        y: 270,
                        width: 30,
                        height: 30
                    });
                }

                // 障害物の移動と判定
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].x -= gameSpeed;

                    // 衝突判定（当たり判定）
                    if (
                        player.x < obstacles[i].x + obstacles[i].width &&
                        player.x + player.width > obstacles[i].x &&
                        player.y < obstacles[i].y + obstacles[i].height &&
                        player.y + player.height > obstacles[i].y
                    ) {
                        isGameOver = true;
                    }

                    // 画面外に出たら削除
                    if (obstacles[i].x + obstacles[i].width < 0) {
