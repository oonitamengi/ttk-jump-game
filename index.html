<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ジャンプゲーム</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #222;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        .game-container {
            width: 100vw;
            aspect-ratio: 2 / 1;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background: #333;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
        }
        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
            padding: 0 10px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>
    <div class="instructions">
        画面タップ または スペースキーでジャンプ（空中で2段ジャンプ可）<br>スタートします
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const player = {
            x: 100,
            y: 250,
            width: 50,
            height: 50,
            vy: 0,
            gravity: 0.75,
            jumpPower: -12.5,
            doubleJumpPower: -10.5,
            jumpCount: 0
        };

        const groundLevel = 250; // 地面の基準位置（y座標）

        let obstacles = [];
        let gameSpeed = 5;
        let score = 0;
        let isStarted = false;
        let isGameOver = false;
        let nextObstacleTimer = 0;

        // プレイヤー画像
        const charImage = new Image();
        let imageLoaded = false;
        charImage.onload = () => { imageLoaded = true; };
        charImage.onerror = () => {
            if (charImage.src.endsWith('TTK_2.PNG')) charImage.src = 'TTK_2.png';
            else if (charImage.src.endsWith('TTK_2.png')) charImage.src = 'TTK_2.jpg';
        };
        charImage.src = 'TTK_2.PNG';

        // 地面の障害物（お花）の画像
        const flowerImage = new Image();
        let flowerLoaded = false;
        flowerImage.onload = () => { flowerLoaded = true; };
        flowerImage.onerror = () => {
            if (flowerImage.src.endsWith('IMG_4627.jpg')) flowerImage.src = 'IMG_4627.JPG';
        };
        flowerImage.src = 'IMG_4627.jpg';

        function triggerAction(e) {
            if (e) {
                e.preventDefault();
            }
            if (!isStarted || isGameOver) {
                resetGame();
                return;
            }

            // 二段階ジャンプの制限と適用
            if (player.jumpCount < 2) {
                if (player.jumpCount === 0) {
                    player.vy = player.jumpPower;
                } else {
                    player.vy = player.doubleJumpPower;
                }
                player.jumpCount++;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                triggerAction();
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            triggerAction(e);
        }, { passive: false });

        canvas.addEventListener('click', (e) => {
            triggerAction();
        });

        function resetGame() {
            obstacles = [];
            score = 0;
            gameSpeed = 5;
            isGameOver = false;
            isStarted = true;
            player.y = groundLevel;
            player.vy = 0;
            player.jumpCount = 0;
            nextObstacleTimer = 50;
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function createObstacle() {
            const rand = Math.random();
            let newObstacle;

            if (rand < 0.45) {
                // 地面の障害物（お花画像を使用）
                newObstacle = {
                    type: 'ground',
                    x: canvas.width,
                    y: 235, // 地面(y=300)の上にぴったり乗るように調整
                    width: 42,
                    height: 65
                };
            } else if (rand < 0.75) {
                newObstacle = {
                    type: 'ptera_low',
                    x: canvas.width,
                    y: 210,
                    width: 45,
                    height: 25,
                    color: '#9b59b6',
                    speedMultiplier: 1.2
                };
            } else {
                newObstacle = {
                    type: 'ptera_high',
                    x: canvas.width,
                    y: 130,
                    width: 45,
                    height: 25,
                    color: '#8e44ad',
                    speedMultiplier: 1.4
                };
            }
            obstacles.push(newObstacle);
        }

        function update() {
            if (isStarted && !isGameOver) {
                score++;

                // 物理演算
                player.vy += player.gravity;
                player.y += player.vy;

                // 地面判定
                if (player.y >= groundLevel) {
                    player.y = groundLevel;
                    player.vy = 0;
                    player.jumpCount = 0;
                }

                // 障害物の生成タイマー
                nextObstacleTimer--;
                if (nextObstacleTimer <= 0) {
                    createObstacle();
                    const minInterval = Math.max(35, 75 - Math.floor(score / 300));
                    const maxInterval = Math.max(70, 140 - Math.floor(score / 300));
                    nextObstacleTimer = getRandomInt(minInterval, maxInterval);
                }

                // 障害物の移動と当たり判定
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    
                    let currentSpeed = gameSpeed;
                    if (obs.type.startsWith('ptera')) {
                        currentSpeed *= obs.speedMultiplier;
                    }
                    obs.x -= currentSpeed;

                    const padding = 6;
                    if (
                        player.x + padding < obs.x + obs.width - padding &&
                        player.x + player.width - padding > obs.x + padding &&
                        player.y + padding
