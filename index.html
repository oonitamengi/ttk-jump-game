<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTK Jump Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #121214;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 450px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #333;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #111;
    }
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .score-container {
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    .badge {
      font-size: 12px;
      background: rgba(255,255,255,0.15);
      padding: 4px 8px;
      border-radius: 4px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .controls-hint {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    .file-input-wrapper {
      pointer-events: auto;
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
    }
    .file-input-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      backdrop-filter: blur(5px);
      transition: all 0.2s;
    }
    .file-input-btn:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div class="file-input-wrapper">
    <label class="file-input-btn">
      📁 画像を選択
      <input type="file" id="imageLoader" accept="image/*">
    </label>
  </div>
  
  <div class="ui-overlay">
    <div class="header">
      <div></div>
      <div id="modeBadge" class="badge">Image: TTK_2.PNG</div>
      <div class="score-container">
        SCORE: <span id="score">0</span> | HIGH: <span id="highscore">0</span>
      </div>
    </div>
    <div class="controls-hint" id="hint">SPACE キーまたはクリックでジャンプ (2段ジャンプ可)</div>
  </div>
  
  <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highscoreEl = document.getElementById('highscore');
  const modeBadge = document.getElementById('modeBadge');
  const hintEl = document.getElementById('hint');
  const imageLoader = document.getElementById('imageLoader');

  // 設定項目
  const PRIMARY_IMAGE_SRC = 'TTK_2.PNG';
  const FALLBACK_SOURCES = ['TTK_2.png', 'TTK_2.jpg', 'TTK_2.jpeg'];

  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
