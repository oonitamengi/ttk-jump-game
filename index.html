<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>レトロテレビ・ジャンプゲーム</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .game-wrapper {
            width: 95vw;
            max-width: 800px;
            aspect-ratio: 2 / 1;
            position: relative;
            background: #1a1a1a;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            cursor: pointer;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
            text-align: center;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <div class="game-wrapper" id="gameWrapper">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <div class="instructions">
        画面をタップ または スペースキーでジャンプ（2段ジャンプ可）
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameWrapper = document.getElementById('gameWrapper');

        const player = {
            x: 100,
            y: 250,
            height: 50,
            width: 50,
            vy: 0,
            gravity: 0.75,
            jumpPower: -12.5,
            doubleJumpPower: -10.5,
            jumpCount: 0
        };

        const groundLevel = 250;

        let obstacles = [];
        let gameSpeed = 5;
        let score = 0;
        let isStarted = false;
        let isGameOver = false;
        let nextObstacleTimer = 0;

        // --- 画像の読み込み（フォールバック付きで確実に描画できるように修正） ---
        const charImage = new Image();
        let imageLoaded = false;
        charImage.onload = () => { imageLoaded = true; };
        charImage.src = 'TTK_2.PNG';

        const flowerImage = new Image();
        let flowerLoaded = false;
        flowerImage.onload = () => { flowerLoaded = true; };
        flowerImage.src = 'IMG_4627.PNG';

        const birdImage = new Image();
        let birdLoaded = false;
        birdImage.onload = () => { birdLoaded = true; };
        birdImage.src = 'IMG_4630.PNG';

        // ジャンプ・ゲーム開始の共通アクション
        function triggerAction(e) {
            if (e) e.preventDefault();

            if (!isStarted || isGameOver) {
                resetGame();
                return;
            }

            if (player.jumpCount < 2) {
                if (player.jumpCount === 0) {
                    player.vy = player.jumpPower;
                } else {
                    player.vy = player.doubleJumpPower;
                }
                player.jumpCount++;
            }
        }

        // スペースキー操作
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                triggerAction();
            }
        });

        // タップ/クリック操作
        gameWrapper.addEventListener('pointerdown', (e) => {
            triggerAction(e);
        });

        function resetGame() {
            obstacles = [];
            score = 0;
            gameSpeed = 5;
            isGameOver = false;
            isStarted = true;
            player.y = groundLevel;
            player.vy = 0;
            player.jumpCount = 0;
            nextObstacleTimer = 50;
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function createObstacle() {
            const rand = Math.random();
            let newObstacle;

            if (rand < 0.45) {
                const fHeight = 65;
                const fWidth = 50;
                newObstacle = {
                    type: 'ground',
                    x: canvas.width,
                    y: 300 - fHeight,
                    width: fWidth,
                    height: fHeight
                };
            } else if (rand < 0.75) {
                const bHeight = 45;
                const bWidth = 60;
                newObstacle = {
                    type: 'bird_low',
                    x: canvas.width,
                    y: 200,
                    width: bWidth,
                    height: bHeight,
                    speedMultiplier: 1.2
                };
            } else {
                const bHeight = 45;
                const bWidth = 60;
                newObstacle = {
                    type: 'bird_high',
                    x: canvas.width,
                    y: 120,
                    width: bWidth,
                    height: bHeight,
                    speedMultiplier: 1.4
                };
            }
            obstacles.push(newObstacle);
        }

        function update() {
            if (isStarted && !isGameOver) {
                score++;

                player.vy += player.gravity;
                player.y += player.vy;

                if (player.y >= groundLevel) {
                    player.y = groundLevel;
                    player.vy = 0;
                    player.jumpCount = 0;
                }

                nextObstacleTimer--;
                if (nextObstacleTimer <= 0) {
                    createObstacle();
                    const minInterval = Math.max(35, 75 - Math.floor(score / 300));
                    const maxInterval = Math.max(70, 140 - Math.floor(score / 300));
                    nextObstacleTimer = getRandomInt(minInterval, maxInterval);
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    let currentSpeed = gameSpeed;
                    if (obs.type.startsWith('bird')) {
                        currentSpeed *= obs.speedMultiplier;
                    }
                    obs.x -= currentSpeed;

                    const padding = 6;
                    if (
                        player.x + padding < obs.x + obs.width - padding &&
                        player.x + player.width - padding > obs.x + padding &&
                        player.y + padding < obs.y + obs.height - padding &&
                        player.y + player.height - padding > obs.y + padding
                    ) {
                        isGameOver = true;
                    }

                    if (obs.x + obs.width < 0) {
                        obstacles.splice(i, 1);
                    }
                }

                gameSpeed = 5 + Math.floor(score / 350);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // プレイ中の描画
            if (isStarted && !isGameOver) {
                // 地面
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, 300);
                ctx.lineTo(canvas.width, 300);
                ctx.stroke();

                // プレイヤー描画（画像未読込時はピンクの四角で確実に表示）
                if (imageLoaded && charImage.complete && charImage.naturalWidth > 0) {
                    ctx.drawImage(charImage, player.x, player.y, player.width, player.height);
                } else {
                    ctx.fillStyle = '#ff80bf';
                    ctx.fillRect(player.x, player.y, player.width, player.height);
                }

                // 障害物描画
                for (let obs of obstacles) {
                    if (obs.type === 'ground') {
                        if (flowerLoaded && flowerImage.complete && flowerImage.naturalWidth > 0) {
                            ctx.drawImage(flowerImage, obs.x, obs.y, obs.width, obs.height);
                        } else {
                            ctx.fillStyle = '#e74c3c';
                            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                        }
                    } else if (obs.type.startsWith('bird')) {
                        if (birdLoaded && birdImage.complete && birdImage.naturalWidth > 0) {
                            ctx.drawImage(birdImage, obs.x, obs.y, obs.width, obs.height);
                        } else {
                            ctx.fillStyle = '#9b59b6';
                            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                        }
                    }
                }

                // スコア
                ctx.fillStyle = '#fff';
                ctx.font = '20px sans-serif';
                ctx.fillText(`SCORE: ${score}`, 20, 30);
            }

            // タイトル画面（TTK_2.PNGを表示）
            if (!isStarted) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (imageLoaded && charImage.complete && charImage.naturalWidth > 0) {
                    const titleImgHeight = 120;
                    const titleImgWidth = titleImgHeight * (charImage.naturalWidth / charImage.naturalHeight);
                    const imgX = (canvas.width - titleImgWidth) / 2;
                    const imgY = canvas.height / 2 - 95;
                    ctx.drawImage(charImage, imgX, imgY, titleImgWidth, titleImgHeight);
                } else {
                    ctx.fillStyle = '#ff80bf';
                    ctx.fillRect(canvas.width / 2 - 30, canvas.height / 2 - 95, 60, 60);
                }

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('JUMP GAME', canvas.width / 2, canvas.height / 2 + 55);

                ctx.font = '18px sans-serif';
                ctx.fillStyle = '#00ffcc';
                ctx.fillText('画面をタップしてスタート', canvas.width / 2, canvas.height / 2 + 95);
                ctx.textAlign = 'left';
            }

            // ゲームオーバー画面
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '32px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = '16px sans-serif';
                ctx.fillText('画面をタップしてリトライ', canvas.width / 2, canvas.height / 2 + 25);
                ctx.textAlign = 'left';
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
