<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>レトロテレビ・ジャンプゲーム</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* テレビ全体を収めるコンテナ（スマホ対応のレスポンシブ設計） */
        .tv-wrapper {
            position: relative;
            width: 100vw;
            max-width: 850px;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        /* 背景のテレビ画像 (TV.jpg)[cite: 2] */
        .tv-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            z-index: 3;
        }

        /* テレビの画面（緑の部分）にハメ込む領域 */
        .tv-screen-area {
            position: absolute;
            top: 13%;
            left: 22%;
            width: 58%;
            height: 72%;
            background: #112211;
            overflow: hidden;
            border-radius: 20px / 15px; /* ブラウン管風の角丸カーブ */
            z-index: 2;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ブラウン管風のスキャンライン（横シマ）演出 */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            z-index: 4;
            pointer-events: none;
        }

        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
            text-align: center;
            padding: 0 10px;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="tv-wrapper">
        <!-- テレビの枠画像 (TV.jpg)[cite: 2] -->
        <img src="TV.jpg" alt="TV Frame" class="tv-frame" id="tvImage">

        <!-- テレビ画面の内側 -->
        <div class="tv-screen-area">
            <div class="scanlines"></div>
            <canvas id="gameCanvas" width="800" height="400"></canvas>
        </div>
    </div>

    <div class="instructions">
        画面タップ または スペースキーでジャンプ（2段ジャンプ可）
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const player = {
            x: 100,
            y: 250,
            height: 50,
            width: 50,
            vy: 0,
            gravity: 0.75,
            jumpPower: -12.5,
            doubleJumpPower: -10.5,
            jumpCount: 0
        };

        const groundLevel = 250;

        let obstacles = [];
        let gameSpeed = 5;
        let score = 0;
        let isStarted = false;
        let isGameOver = false;
        let nextObstacleTimer = 0;

        // プレイヤー画像の設定（TTK_2.PNG）
        const charImage = new Image();
        let imageLoaded = false;
        charImage.onload = () => {
            imageLoaded = true;
            const aspectRatio = charImage.naturalWidth / charImage.naturalHeight;
            player.width = player.height * aspectRatio;
        };
        charImage.onerror = () => { imageLoaded = false; };
        charImage.src = 'TTK_2.PNG';

        // 地面の障害物（お花：IMG_4627.PNG）の設定
        const flowerImage = new Image();
        let flowerLoaded = false;
        let flowerAspectRatio = 1;
        flowerImage.onload = () => {
            flowerLoaded = true;
            flowerAspectRatio = flowerImage.naturalWidth / flowerImage.naturalHeight;
        };
        flowerImage.onerror = () => { flowerLoaded = false; };
        flowerImage.src = 'IMG_4627.PNG';

        // 上空の障害物（鳥：IMG_4630.PNG）の設定
        const birdImage = new Image();
        let birdLoaded = false;
        let birdAspectRatio = 1.3;
        birdImage.onload = () => {
            birdLoaded = true;
            birdAspectRatio = birdImage.naturalWidth / birdImage.naturalHeight;
        };
        birdImage.onerror = () => { birdLoaded = false; };
        birdImage.src = 'IMG_4630.PNG';

        function triggerAction() {
            if (!isStarted || isGameOver) {
                resetGame();
                return;
            }

            if (player.jumpCount < 2) {
                if (player.jumpCount === 0) {
                    player.vy = player.jumpPower;
                } else {
                    player.vy = player.doubleJumpPower;
                }
                player.jumpCount++;
            }
        }

        // キーボード操作
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                triggerAction();
            }
        });

        // スマホのタップ操作（誤作動防止対応）
        let touchHandled = false;
        window.addEventListener('touchstart', (e) => {
            touchHandled = true;
            triggerAction();
            setTimeout(() => { touchHandled = false; }, 300);
        }, { passive: true });

        window.addEventListener('mousedown', (e) => {
            if (touchHandled) return;
            triggerAction();
        });

        function resetGame() {
            obstacles = [];
            score = 0;
            gameSpeed = 5;
            isGameOver = false;
            isStarted = true;
            player.y = groundLevel;
            player.vy = 0;
            player.jumpCount = 0;
            nextObstacleTimer = 50;
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function createObstacle() {
            const rand = Math.random();
            let newObstacle;

            if (rand < 0.45) {
                const fHeight = 65;
                const fWidth = fHeight * flowerAspectRatio;
                newObstacle = {
                    type: 'ground',
                    x: canvas.width,
                    y: 300 - fHeight,
                    width: fWidth,
                    height: fHeight
                };
            } else if (rand < 0.75) {
                const bHeight = 45;
                const bWidth = bHeight * birdAspectRatio;
                newObstacle = {
                    type: 'bird_low',
                    x: canvas.width,
                    y: 200,
                    width: bWidth,
                    height: bHeight,
                    speedMultiplier: 1.2
                };
            } else {
                const bHeight = 45;
                const bWidth = bHeight * birdAspectRatio;
                newObstacle = {
                    type: 'bird_high',
                    x: canvas.width,
                    y: 120,
                    width: bWidth,
                    height: bHeight,
                    speedMultiplier: 1.4
                };
            }
            obstacles.push(newObstacle);
        }

        function update() {
            if (isStarted && !isGameOver) {
                score++;

                player.vy += player.gravity;
                player.y += player.vy;

                if (player.y >= groundLevel) {
                    player.y = groundLevel;
                    player.vy = 0;
                    player.jumpCount = 0;
                }

                nextObstacleTimer--;
                if (nextObstacleTimer <= 0) {
                    createObstacle();
                    const minInterval = Math.max(35, 75 - Math.floor(score / 300));
                    const maxInterval = Math.max(70, 140 - Math.floor(score / 300));
                    nextObstacleTimer = getRandomInt(minInterval, maxInterval);
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    let currentSpeed = gameSpeed;
                    if (obs.type.startsWith('bird')) {
                        currentSpeed *= obs.speedMultiplier;
                    }
                    obs.x -= currentSpeed;

                    const padding = 6;
                    if (
                        player.x + padding < obs.x + obs.width - padding &&
                        player.x + player.width - padding > obs.x + padding &&
                        player.y + padding < obs.y + obs.height - padding &&
                        player.y + player.height - padding > obs.y + padding
                    ) {
                        isGameOver = true;
                    }

                    if (obs.x + obs.width < 0) {
                        obstacles.splice(i, 1);
                    }
                }

                gameSpeed = 5 + Math.floor(score / 350);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 地面描画
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 300);
            ctx.lineTo(canvas.width, 300);
            ctx.stroke();

            // プレイヤー描画
            if (imageLoaded) {
                ctx.drawImage(charImage, player.x, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = '#ff80bf';
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }

            // 障害物描画
            for (let obs of obstacles) {
                if (obs.type === 'ground') {
                    if (flowerLoaded) {
                        ctx.drawImage(flowerImage, obs.x, obs.y, obs.width, obs.height);
                    } else {
                        ctx.fillStyle = '#e74c3c';
                        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    }
                } else if (obs.type.startsWith('bird')) {
                    if (birdLoaded) {
                        ctx.drawImage(birdImage, obs.x, obs.y, obs.width, obs.height);
                    } else {
                        ctx.fillStyle = '#9b59b6';
                        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    }
                }
            }

            // スコア表示
            ctx.fillStyle = '#fff';
            ctx.font = '20px sans-serif';
            ctx.fillText(`SCORE: ${score}`, 20, 30);

            // スタート画面
            if (!isStarted) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('画面タップでスタート', canvas.width / 2, canvas.height / 2);
                ctx.textAlign = 'left';
            }

            // ゲームオーバー画面
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '30px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 15);
                ctx.font = '16px sans-serif';
                ctx.fillText('画面タップでリトライ', canvas.width / 2, canvas.height / 2 + 25);
                ctx.textAlign = 'left';
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
