<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOBU-YATU</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #050b07;
            color: #00ffcc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .crt-monitor {
            position: relative;
            width: 95vw;
            max-width: 800px;
            aspect-ratio: 2 / 1;
            background: #05140b;
            border-radius: 20px;
            box-shadow: 
                inset 0 0 40px rgba(0, 255, 170, 0.25),
                0 0 30px rgba(0, 255, 204, 0.3),
                0 0 0 12px #122118,
                0 0 0 16px #08100b;
            border: 3px solid #004d33;
            overflow: hidden;
            cursor: pointer;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            filter: drop-shadow(0 0 4px #00ffcc);
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.35) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .instructions {
            margin-top: 25px;
            font-size: 14px;
            color: #00b386;
            text-align: center;
            padding: 0 10px;
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.4);
        }
    </style>
</head>
<body>

    <div class="crt-monitor" id="crtMonitor">
        <div class="scanlines"></div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <div class="instructions">
        画面タップ または スペースキーでジャンプ（2段ジャンプ可）
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const crtMonitor = document.getElementById('crtMonitor');

        const player = {
            x: 100,
            y: 250,
            height: 50,
            width: 50,
            vy: 0,
            gravity: 0.75,
            jumpPower: -12.5,
            doubleJumpPower: -10.5,
            jumpCount: 0
        };

        const groundLevel = 250;

        let obstacles = [];
        let gameSpeed = 5;
        let score = 0;
        let isStarted = false;
        let isGameOver = false;
        let nextObstacleTimer = 0;

        const charImage = new Image();
        let imageLoaded = false;
        charImage.onload = () => { imageLoaded = true; };
        charImage.src = 'TTK_2.PNG';

        const flowerImage = new Image();
        let flowerLoaded = false;
        flowerImage.onload = () => { flowerLoaded = true; };
        flowerImage.src = 'IMG_4627.PNG';

        const birdImage = new Image();
        let birdLoaded = false;
        birdImage.onload = () => { birdLoaded = true; };
        birdImage.src = 'IMG_4630.PNG';

        function triggerAction(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            if (!isStarted || isGameOver) {
                resetGame();
                return;
            }

            if (player.jumpCount < 2) {
                if (player.jumpCount === 0) {
                    player.vy = player.jumpPower;
                } else {
                    player.vy = player.doubleJumpPower;
                }
                player.jumpCount++;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                triggerAction();
            }
        });

        crtMonitor.addEventListener('pointerdown', (e) => {
            triggerAction(e);
        });

        function resetGame() {
            obstacles = [];
            score = 0;
            gameSpeed = 5;
            isGameOver = false;
            isStarted = true;
            player.y = groundLevel;
            player.vy = 0;
            player.jumpCount = 0;
            nextObstacleTimer = 50;
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function createObstacle() {
            const rand = Math.random();
            let newObstacle;

            if (rand < 0.45) {
                const fHeight = 65;
                const fWidth = 50;
                newObstacle = {
                    type: 'ground',
                    x: canvas.width,
                    y: 300 - fHeight,
                    width: fWidth,
                    height: fHeight
                };
            } else if (rand < 0.75) {
                const bHeight = 45;
                const bWidth = 60;
                newObstacle = {
                    type: 'bird_low',
                    x: canvas.width,
                    y: 200,
                    width: bWidth,
                    height: bHeight,
                    speedMultiplier: 1.2
                };
            } else {
                const bHeight = 45;
                const bWidth = 60;
                newObstacle = {
                    type: 'bird_high',
                    x: canvas.width,
                    y: 120,
                    width: bWidth,
                    height: bHeight,
                    speedMultiplier: 1.4
                };
            }
            obstacles.push(newObstacle);
        }

        function update() {
            if (isStarted && !isGameOver) {
                score++;

                player.vy += player.gravity;
                player.y += player.vy;

                if (player.y >= groundLevel) {
                    player.y = groundLevel;
                    player.vy = 0;
                    player.jumpCount = 0;
                }

                nextObstacleTimer--;
                if (nextObstacleTimer <= 0) {
                    createObstacle();
                    const minInterval = Math.max(35, 75 - Math.floor(score / 300));
                    const maxInterval = Math.max(70, 140 - Math.floor(score / 300));
                    nextObstacleTimer = getRandomInt(minInterval, maxInterval);
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    let currentSpeed = gameSpeed;
                    if (obs.type.startsWith('bird')) {
                        currentSpeed *= obs.speedMultiplier;
                    }
                    obs.x -= currentSpeed;

                    const padding = 6;
                    if (
                        player.x + padding < obs.x + obs.width - padding &&
                        player.x + player.width - padding > obs.x + padding &&
                        player.y + padding < obs.y + obs.height - padding &&
                        player.y + player.height - padding > obs.y + padding
                    ) {
                        isGameOver = true;
                    }

                    if (obs.x + obs.width < 0) {
                        obstacles.splice(i, 1);
                    }
                }

                gameSpeed = 5 + Math.floor(score / 350);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isStarted && !isGameOver) {
                ctx.strokeStyle = '#00ffcc';
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = 8;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, 300);
                ctx.lineTo(canvas.width, 300);
                ctx.stroke();
                ctx.shadowBlur = 0;

                if (imageLoaded && charImage.complete && charImage.naturalWidth > 0) {
                    const pWidth = 50 * (charImage.naturalWidth / charImage.naturalHeight);
                    ctx.drawImage(charImage, player.x, player.y, pWidth, player.height);
                } else {
                    ctx.fillStyle = '#00ffcc';
                    ctx.fillRect(player.x, player.y, player.width, player.height);
                }

                for (let obs of obstacles) {
                    if (obs.type === 'ground') {
                        if (flowerLoaded && flowerImage.complete && flowerImage.naturalWidth > 0) {
                            ctx.drawImage(flowerImage, obs.x, obs.y, obs.width, obs.height);
                        } else {
                            ctx.fillStyle = '#ff3366';
                            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                        }
                    } else if (obs.type.startsWith('bird')) {
                        if (birdLoaded && birdImage.complete && birdImage.naturalWidth > 0) {
                            ctx.drawImage(birdImage, obs.x, obs.y, obs.width, obs.height);
                        } else {
                            ctx.fillStyle = '#33ccff';
                            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                        }
                    }
                }

                ctx.fillStyle = '#00ffcc';
                ctx.font = '20px "Courier New", monospace';
                ctx.fillText(`SCORE: ${score}`, 20, 35);
            }

            if (!isStarted) {
                ctx.fillStyle = 'rgba(5, 20, 11, 0.9)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (imageLoaded && charImage.complete && charImage.naturalWidth > 0) {
                    const titleImgHeight = 120;
                    const titleImgWidth = titleImgHeight * (charImage.naturalWidth / charImage.naturalHeight);
                    const imgX = (canvas.width - titleImgWidth) / 2;
                    const imgY = canvas.height / 2 - 95;
                    ctx.drawImage(charImage, imgX, imgY, titleImgWidth, titleImgHeight);
                }

                ctx.fillStyle = '#00ffcc';
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = 10;
                ctx.font = 'bold 32px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('TOBU-YATU', canvas.width / 2, canvas.height / 2 + 55);

                ctx.font = '18px "Courier New", monospace';
                ctx.fillText('画面をタップしてスタート', canvas.width / 2, canvas.height / 2 + 95);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
            }

            if (isGameOver) {
                ctx.fillStyle = 'rgba(5, 10, 5, 0.88)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff3366';
                ctx.shadowColor = '#ff3366';
                ctx.shadowBlur = 12;
                ctx.font = 'bold 32px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = '#00ffcc';
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = 8;
                ctx.font = '16px "Courier New", monospace';
                ctx.fillText('画面をタップしてリトライ', canvas.width / 2, canvas.height / 2 + 25);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
