<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOBU-YATU</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #050b07;
            color: #00ffcc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .crt-monitor {
            position: relative;
            width: 95vw;
            max-width: 800px;
            aspect-ratio: 2 / 1;
            background: #05140b;
            border-radius: 20px;
            box-shadow: 
                inset 0 0 40px rgba(0, 255, 170, 0.25),
                0 0 30px rgba(0, 255, 204, 0.3),
                0 0 0 12px #122118,
                0 0 0 16px #08100b;
            border: 3px solid #004d33;
            overflow: hidden;
            cursor: pointer;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            filter: drop-shadow(0 0 4px #00ffcc);
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.35) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .ui-container {
            width: 95vw;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
            gap: 10px;
        }

        .instructions {
            font-size: 13px;
            color: #00b386;
            text-align: center;
            padding: 0 10px;
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.4);
        }

        /* アクションボタン（GAME START / RETRY） */
        #actionButton {
            width: 100%;
            max-width: 320px;
            height: 50px;
            background: rgba(0, 255, 204, 0.2);
            border: 2px solid #00ffcc;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ffcc;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            touch-action: manipulation;
            text-shadow: 0 0 6px rgba(0, 255, 204, 0.8);
            cursor: pointer;
        }

        #actionButton:active {
            background: rgba(0, 255, 204, 0.4);
            transform: scale(0.97);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.7);
        }

        /* スマホ用ジャンプボタン */
        #jumpButton {
            width: 100%;
            max-width: 320px;
            height: 55px;
            background: rgba(0, 255, 204, 0.12);
            border: 2px solid #00ffcc;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ffcc;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            touch-action: none;
            text-shadow: 0 0 6px rgba(0, 255, 204, 0.8);
            cursor: pointer;
            display: none;
        }

        #jumpButton:active {
            background: rgba(0, 255, 204, 0.35);
            transform: scale(0.97);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
        }
    </style>
</head>
<body>

    <div class="crt-monitor" id="crtMonitor">
        <div class="scanlines"></div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <!-- ゲーム画面の下部に配置する操作系エリア -->
    <div class="ui-container">
        <div class="instructions">
            画面タップ または スペースキーでジャンプ（2段ジャンプ可）
        </div>
        <div id="actionButton">GAME START</div>
        <div id="jumpButton">▲ JUMP ▲</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const crtMonitor = document.getElementById('crtMonitor');
        const jumpButton = document.getElementById('jumpButton');
        const actionButton = document.getElementById('actionButton');

        const player = {
            x: 100,
            y: 250,
            height: 50,
            width: 50,
            vy: 0,
            gravity: 0.75,
            jumpPower: -12.5,
            doubleJumpPower: -10.5,
            jumpCount: 0
        };

        const groundLevel = 250;

        let obstacles = [];
        let gameSpeed = 5;
        let score = 0;
        let isStarted = false;
        let isGameOver = false;
        let nextObstacleTimer = 0;

        // アセット画像の読み込み
        const charImage = new Image();
        let imageLoaded = false;
        charImage.onload = () => { imageLoaded = true; };
        charImage.src = 'TTK_2.PNG';

        const flowerImage = new Image();
        let flowerLoaded = false;
        let flowerAspect = 1;
        flowerImage.onload = () => { 
            flowerLoaded = true; 
            if (flowerImage.naturalHeight > 0) {
                flowerAspect = flowerImage.naturalWidth / flowerImage.naturalHeight;
            }
        };
        flowerImage.src = 'IMG_4627.PNG';

        const birdImage = new Image();
        let birdLoaded = false;
        let birdAspect = 1.3;
        birdImage.onload = () => { 
            birdLoaded = true; 
            if (birdImage.naturalHeight > 0) {
                birdAspect = birdImage.naturalWidth / birdImage.naturalHeight;
            }
        };
        birdImage.src = 'IMG_4630.PNG';

        const jumperImage = new Image();
        let jumperLoaded = false;
        let jumperAspect = 1;
        jumperImage.onload = () => { 
            jumperLoaded = true; 
            if (jumperImage.naturalHeight > 0) {
                jumperAspect = jumperImage.naturalWidth / jumperImage.naturalHeight;
            }
        };
        jumperImage.src = 'IMG_4632.PNG';

        function updateUIState() {
            if (!isStarted) {
                actionButton.style.display = 'flex';
                actionButton.textContent = 'GAME START';
                jumpButton.style.display = 'none';
            } else if (isGameOver) {
                actionButton.style.display = 'flex';
                actionButton.textContent = 'RETRY';
                jumpButton.style.display = 'none';
            } else {
                actionButton.style.display = 'none';
                jumpButton.style.display = 'flex';
            }
        }

        function triggerAction(e) {
            if (e && e.cancelable) {
                e.preventDefault();
                e.stopPropagation();
            }

            if (!isStarted || isGameOver) {
                resetGame();
                return;
            }

            if (player.jumpCount < 2) {
                if (player.jumpCount === 0) {
                    player.vy = player.jumpPower;
                } else {
                    player.vy = player.doubleJumpPower;
                }
                player.jumpCount++;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                triggerAction(e);
            }
        });

        crtMonitor.addEventListener('pointerdown', (e) => {
            triggerAction(e);
        }, { passive: false });

        if (actionButton) {
            actionButton.addEventListener('pointerdown', (e) => {
                triggerAction(e);
            }, { passive: false });
        }

        if (jumpButton) {
            jumpButton.addEventListener('pointerdown', (e) => {
                if (isStarted && !isGameOver) {
                    triggerAction(e);
                }
            }, { passive: false });
        }

        function resetGame() {
            obstacles = [];
            score = 0;
            gameSpeed = 5;
            isGameOver = false;
            isStarted = true;
            player.y = groundLevel;
            player.vy = 0;
            player.jumpCount = 0;
            nextObstacleTimer = 50;
            updateUIState();
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function createObstacle() {
            const rand = Math.random();
            const highDiff = score > 200;
            const extremeDiff = score > 500;

            let bHeight = 45;
            let bWidth = bHeight * birdAspect;
            let fHeight = 65;
            let fWidth = fHeight * flowerAspect;
            let jHeight = 50;
            let jWidth = jHeight * jumperAspect;

            if (extremeDiff && rand < 0.22) {
                obstacles.push({
                    type: 'sine_bird',
                    x: canvas.width,
                    baseY: getRandomInt(140, 200),
                    y: 170,
                    width: bWidth,
                    height: bHeight,
                    angle: 0,
                    speedMultiplier: 1.1
                });
            } else if (highDiff && rand < 0.42) {
                obstacles.push({
                    type: 'accel_bird',
                    x: canvas.width,
                    y: getRandomInt(120, 220),
                    width: bWidth,
                    height: bHeight
                });
            } else if (highDiff && rand < 0.62) {
                obstacles.push({
                    type: 'jumping_enemy',
                    x: canvas.width,
                    y: 300 - jHeight,
                    width: jWidth,
                    height: jHeight,
                    vy: 0,
                    jumpTimer: getRandomInt(20, 50)
                });
            } else if (highDiff && rand < 0.77) {
                const targetH = 70;
                const targetW = targetH * flowerAspect;
                obstacles.push({
                    type: 'growing_flower',
                    x: canvas.width,
                    y: 300 - 15,
                    width: targetW,
                    height: 15,
                    targetHeight: targetH,
                    growSpeed: 2.2
                });
            } else if (rand < 0.88) {
                obstacles.push({
                    type: 'ground',
                    x: canvas.width,
                    y: 300 - fHeight,
                    width: fWidth,
                    height: fHeight
                });
            } else {
                obstacles.push({
                    type: 'bird_straight',
                    x: canvas.width,
                    y: getRandomInt(130, 210),
                    width: bWidth,
                    height: bHeight,
                    speedMultiplier: 1.2
                });
            }
        }

        function update() {
            if (isStarted && !isGameOver) {
                score++;

                player.vy += player.gravity;
                player.y += player.vy;

                if (player.y >= groundLevel) {
                    player.y = groundLevel;
                    player.vy = 0;
                    player.jumpCount = 0;
                }

                nextObstacleTimer--;
                if (nextObstacleTimer <= 0) {
                    createObstacle();
                    
                    if (score > 5000) {
                        nextObstacleTimer = getRandomInt(15, 110);
                    } else {
                        const minInterval = Math.max(30, 70 - Math.floor(score / 250));
                        const maxInterval = Math.max(60, 130 - Math.floor(score / 250));
                        nextObstacleTimer = getRandomInt(minInterval, maxInterval);
                    }
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    let currentSpeed = gameSpeed;

                    if (obs.type === 'sine_bird') {
                        currentSpeed *= obs.speedMultiplier;
                        obs.angle += 0.08;
                        obs.y = obs.baseY + Math.sin(obs.angle) * 45;
                    } else if (obs.type === 'accel_bird') {
                        if (obs.x < 520 && obs.x > 320) {
                            currentSpeed *= 0.25;
                        } else if (obs.x <= 320) {
                            currentSpeed *= 2.4;
                        }
                    } else if (obs.type === 'jumping_enemy') {
                        obs.vy += 0.6;
                        obs.y += obs.vy;
                        if (obs.y >= 300 - obs.height) {
                            obs.y = 300 - obs.height;
                            obs.vy = 0;
                            obs.jumpTimer--;
                            if (obs.jumpTimer <= 0) {
                                obs.vy = -9.5;
                                obs.jumpTimer = getRandomInt(30, 60);
                            }
                        }
                    } else if (obs.type === 'growing_flower') {
                        if (obs.height < obs.targetHeight) {
                            obs.height += obs.growSpeed;
                            if (obs.height > obs.targetHeight) obs.height = obs.targetHeight;
                            obs.y = 300 - obs.height;
                        }
                    } else if (obs.type === 'bird_straight') {
                        currentSpeed *= obs.speedMultiplier;
                    }

                    obs.x -= currentSpeed;

                    const padding = 6;
                    if (
                        player.x + padding < obs.x + obs.width - padding &&
                        player.x + player.width - padding > obs.x + padding &&
                        player.y + padding < obs.y + obs.height - padding &&
                        player.y + player.height - padding > obs.y + padding
                    ) {
                        isGameOver = true;
                        updateUIState();
                    }

                    if (obs.x + obs.width < 0) {
                        obstacles.splice(i, 1);
                    }
                }

                gameSpeed = 5 + Math.floor(score / 300);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isStarted && !isGameOver) {
                // 地面
                ctx.strokeStyle = '#00ffcc';
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = 8;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, 300);
                ctx.lineTo(canvas.width, 300);
                ctx.stroke();
                ctx.shadowBlur = 0;

                // プレイヤー（TTK_2.PNG）
                if (imageLoaded && charImage.complete && charImage.naturalWidth > 0) {
                    const pWidth = 50 * (charImage.naturalWidth / charImage.naturalHeight);
                    ctx.drawImage(charImage, player.x, player.y, pWidth, player.height);
                } else {
                    ctx.fillStyle = '#00ffcc';
                    ctx.fillRect(player.x, player.y, player.width, player.height);
                }

                // 障害物描画
                for (let obs of obstacles) {
                    if (obs.type === 'ground' || obs.type === 'growing_flower') {
                        if (flowerLoaded && flowerImage.complete && flowerImage.naturalWidth > 0) {
                            ctx.drawImage(flowerImage, obs.x, obs.y, obs.width, obs.height);
                        } else {
                            ctx.fillStyle = '#ff3366';
                            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                        }
                    } else if (obs.type === 'jumping_enemy') {
                        if (jumperLoaded && jumperImage.complete && jumperImage.naturalWidth > 0) {
                            ctx.drawImage(jumperImage, obs.x, obs.y, obs.width, obs.height);
                        } else {
                            ctx.fillStyle = '#ffaa00';
                            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                        }
                    } else {
                        if (birdLoaded && birdImage.complete && birdImage.naturalWidth > 0) {
                            ctx.drawImage(birdImage, obs.x, obs.y, obs.width, obs.height);
                        } else {
                            ctx.fillStyle = '#33ccff';
                            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                        }
                    }
                }

                ctx.fillStyle = '#00ffcc';
                ctx.font = '20px "Courier New", monospace';
                ctx.fillText(`SCORE: ${score}`, 20, 35);
            }

            // タイトル画面
            if (!isStarted) {
                ctx.fillStyle = 'rgba(5, 20, 11, 0.9)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (imageLoaded && charImage.complete && charImage.naturalWidth > 0) {
                    const titleImgHeight = 120;
                    const titleImgWidth = titleImgHeight * (charImage.naturalWidth / charImage.naturalHeight);
                    const imgX = (canvas.width - titleImgWidth) / 2;
                    const imgY = canvas.height / 2 - 100;
                    ctx.drawImage(charImage, imgX, imgY, titleImgWidth, titleImgHeight);
                }

                ctx.fillStyle = '#00ffcc';
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = 10;
                ctx.font = 'bold 36px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('TOBU-YATU', canvas.width / 2, canvas.height / 2 + 50);
                ctx.shadowBlur = 0;
            }

            // ゲームオーバー画面
            if (isGameOver) {
                ctx.fillStyle = 'rgba(5, 10, 5, 0.92)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // GAME OVER テキスト
                ctx.fillStyle = '#ff3366';
                ctx.shadowColor = '#ff3366';
                ctx.shadowBlur = 12;
                ctx.font = 'bold 36px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, 160);

                // 今回のスコア表示
                ctx.fillStyle = '#00ffcc';
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = 8;
                ctx.font = 'bold 24px "Courier New", monospace';
                ctx.fillText(`SCORE: ${score}`, canvas.width / 2, 220);
                ctx.shadowBlur = 0;
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        updateUIState();
        loop();
    </script>
</body>
</html>
