<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ジャンプゲーム</title>
    <style>
        body { margin: 0; padding: 0; background: #222; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; overflow: hidden; }
        canvas { background: #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer; }
        .instructions { margin-top: 15px; font-size: 14px; color: #aaa; text-align: center; }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div class="instructions">
        [Space] / 画面クリックでジャンプ・二段階ジャンプ / スタートします
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const player = {
            x: 100,
            y: 250,
            width: 50,
            height: 50,
            vy: 0,
            gravity: 0.8,
            jumpPower: -13,
            doubleJumpPower: -11,
            jumpCount: 0
        };

        const groundLevel = 300;

        let obstacles = [];
        let gameSpeed = 5;
        let score = 0;
        let isStarted = false;
        let isGameOver = false;
        let nextObstacleTimer = 0;

        const charImage = new Image();
        let imageLoaded = false;
        charImage.onload = () => { imageLoaded = true; };
        charImage.onerror = () => {
            if (charImage.src.endsWith('TTK_2.PNG')) charImage.src = 'TTK_2.png';
            else if (charImage.src.endsWith('TTK_2.png')) charImage.src = 'TTK_2.jpg';
        };
        charImage.src = 'TTK_2.PNG';

        function triggerAction() {
            if (!isStarted || isGameOver) {
                resetGame();
                return;
            }

            if (player.jumpCount < 2) {
                if (player.jumpCount === 0) {
                    player.vy = player.jumpPower;
                } else {
                    player.vy = player.doubleJumpPower;
                }
                player.jumpCount++;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                triggerAction();
            }
        });

        canvas.addEventListener('click', () => {
            triggerAction();
        });

        function resetGame() {
            obstacles = [];
            score = 0;
            gameSpeed = 5;
            isGameOver = false;
            isStarted = true;
            player.y = groundLevel;
            player.vy = 0;
            player.jumpCount = 0;
            nextObstacleTimer = 60;
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function createObstacle() {
            // ランダムに障害物の種類を決定
            // 0: 地面の障害物（ジャンプで避ける）
            // 1: 低いプテラノドン（ジャンプで避ける）
            // 2: 高いプテラノドン（ジャンプするとぶつかるため、くぐる必要がある）
            const typeRand = Math.random();
            let newObstacle;

            if (typeRand < 0.4) {
                newObstacle = {
                    type: 'ground',
                    x: canvas.width,
                    y: 270,
                    width: 30,
                    height: 30,
                    color: '#ff3333'
                };
            } else if (typeRand < 0.7) {
                newObstacle = {
                    type: 'ptera_low',
                    x: canvas.width,
                    y: 220, // プレイヤーが少しジャンプして避ける高さ
                    width: 50,
                    height: 30,
                    color: '#9b59b6',
                    speedX: gameSpeed * 1.3
                };
            } else {
                newObstacle = {
                    type: 'ptera_high',
                    x: canvas.width,
                    y: 130, // 高い位置（ジャンプすると当たってしまう）
                    width: 50,
                    height: 30,
                    color: '#8e44ad',
                    speedX: gameSpeed * 1.4
                };
            }
            obstacles.push(newObstacle);
        }

        function update() {
            if (isStarted && !isGameOver) {
                score++;

                player.vy += player.gravity;
                player.y += player.vy;

                if (player.y >= groundLevel) {
                    player.y = groundLevel;
                    player.vy = 0;
                    player.jumpCount = 0;
                }

                nextObstacleTimer--;
                if (nextObstacleTimer <= 0) {
                    createObstacle();
                    const minInterval = Math.max(40, 90 - Math.floor(score / 250));
                    const maxInterval = Math.max(80, 170 - Math.floor(score / 250));
                    nextObstacleTimer = getRandomInt(minInterval, maxInterval);
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    if (obs.type === 'ground') {
                        obs.x -= gameSpeed;
                    } else {
                        obs.x -= obs.speedX;
                    }

                    if (
                        player.x < obs.x + obs.width &&
                        player.x + player.width > obs.x &&
                        player.y < obs.y + obs.height &&
                        player.y + player.height > obs.y
                    ) {
                        isGameOver = true;
                    }

                    if (obs.x + obs.width < 0) {
                        obstacles.splice(i, 1);
                    }
                }

                gameSpeed = 5 + Math.floor(score / 400);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#555';
            ctx.fillRect(0, 330, canvas.width, 70);

            if (imageLoaded) {
                ctx.drawImage(charImage, player.x, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = '#ff80bf';
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }

            for (let obs of obstacles) {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            }

            ctx.fillStyle = '#fff';
            ctx.font = '20px sans-serif';
            ctx.fillText(`SCORE: ${score}`, 20, 30);

            if (!isStarted) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('クリック または スペースキーでスタート', canvas.width / 2, canvas.height / 2);
                ctx.textAlign = 'left';
            }

            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '30px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 15);
                ctx.font = '16px sans-serif';
                ctx.fillText('クリック または スペースキーでリトライ', canvas.width / 2, canvas.height / 2 + 25);
                ctx.textAlign = 'left';
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
